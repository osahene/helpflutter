name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - run: flutter pub get

      # Proves the app actually compiles end to end (Gradle, the manifest,
      # ProGuard rules, etc — none of which `flutter analyze`/`flutter test`
      # touch). FRONTEND_API_KEY only needs to be *some* value for this: it's
      # checked at app startup (ApiClient.assertConfigured, see
      # lib/main.dart), not at compile time, so this build passing doesn't
      # require the real production key — add one as a repo secret only if
      # you also want this to double as a smoke test against the real
      # backend.
      - run: |
          flutter build apk --release \
            --dart-define=FRONTEND_API_KEY="${FRONTEND_API_KEY:-ci-placeholder-key}"
        env:
          FRONTEND_API_KEY: ${{ secrets.FRONTEND_API_KEY }}

      # Play Store submissions need an App Bundle, not an APK — a distinct
      # Gradle build path (bundleRelease vs assembleRelease) that the apk
      # build above never exercises. Same as that step, this runs without
      # the real upload keystore (android/key.properties is real locally
      # but gitignored, so it's simply absent here) and so produces a
      # debug-signed .aab — not upload-ready, but enough to catch a bundle-
      # specific build break in CI. The real, upload-signed bundle still
      # has to be built locally with the real keystore before a Play
      # Console upload.
      - run: |
          flutter build appbundle --release \
            --dart-define=FRONTEND_API_KEY="${FRONTEND_API_KEY:-ci-placeholder-key}"
        env:
          FRONTEND_API_KEY: ${{ secrets.FRONTEND_API_KEY }}
