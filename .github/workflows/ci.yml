name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - run: flutter pub get

      # Proves the app actually compiles end to end (Gradle, the manifest,
      # ProGuard rules, etc — none of which `flutter analyze`/`flutter test`
      # touch). FRONTEND_API_KEY only needs to be *some* value for this: it's
      # checked at app startup (ApiClient.assertConfigured, see
      # lib/main.dart), not at compile time, so this build passing doesn't
      # require the real production key — add one as a repo secret only if
      # you also want this to double as a smoke test against the real
      # backend.
      - run: |
          flutter build apk --release \
            --dart-define=FRONTEND_API_KEY="${FRONTEND_API_KEY:-ci-placeholder-key}"
        env:
          FRONTEND_API_KEY: ${{ secrets.FRONTEND_API_KEY }}
